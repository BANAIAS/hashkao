<script>

let hauteur = Math.round(elementCarte.clientHeight);

// À 2500, la France occupe le cadrage actuel dans une zone de 1000 x 650.
// Quand le cadre est plus petit, l'échelle diminue pour que le même
// cadrage reste entièrement visible.
function echelleProjection() {
    return 2500 * Math.min(largeur / 1000, hauteur / 650);
}

    });
}



chargerReliefEurope()
    .then(() => {

function altitudeTerrain(longitude, latitude) {
    if (!reliefFrance) {
        return null;
    }

    const [ouest, sud, est, nord] = reliefFrance.bounds;

    const colonne = Math.floor(
        (longitude - ouest) * reliefFrance.resolution
    );

    const ligne = Math.floor(
        (nord - latitude) * reliefFrance.resolution
    );

    if (
        colonne < 0 ||
        colonne >= reliefFrance.largeur ||
        ligne < 0 ||
        ligne >= reliefFrance.hauteur
    ) {
        return null;
    }

    
    const altitude = reliefFrance.altitudes[ligne][colonne];


    return Number.isFinite(altitude) ? altitude : null;
}


function altitudeTerrainEurope(longitude, latitude) {
    if (!reliefEurope) {
        return null;
    }

    const [ouest, sud, est, nord] = reliefEurope.bounds;

    const colonne = Math.floor(
        (longitude - ouest) * reliefEurope.resolution
    );

    const ligne = Math.floor(
        (nord - latitude) * reliefEurope.resolution
    );

    if (
        colonne < 0 ||
        colonne >= reliefEurope.largeur ||
        ligne < 0 ||
        ligne >= reliefEurope.hauteur
    ) {
        return null;
    }

    const altitude = reliefEurope.altitudes[ligne][colonne];

    return Number.isFinite(altitude) ? altitude : null;
}


function penteTerrainEurope(longitude, latitude) {
    if (!reliefEurope) {
        return null;
    }

    const pas = 1 / reliefEurope.resolution;

    const ouest = altitudeTerrainEurope(longitude - pas, latitude);
    const est = altitudeTerrainEurope(longitude + pas, latitude);
    const nord = altitudeTerrainEurope(longitude, latitude + pas);
    const sud = altitudeTerrainEurope(longitude, latitude - pas);

    if (![ouest, est, nord, sud].every(Number.isFinite)) {
        return null;
    }

    const latitudeRad = latitude * Math.PI / 180;

    const distanceX = 111320 * Math.cos(latitudeRad) * 2 * pas;
    const distanceY = 111320 * 2 * pas;

    return {
        penteEst: (est - ouest) / distanceX,
        penteNord: (nord - sud) / distanceY
    };
}


function eclairageTerrainEurope(longitude, latitude) {
    const pente = penteTerrainEurope(longitude, latitude);

    if (!pente) {
        return null;
    }

    // Lumière venant du nord-ouest, à 45 degrés
    const azimut = 315 * Math.PI / 180;
    const hauteurSoleil = 45 * Math.PI / 180;

    const lumiereX = Math.sin(azimut) * Math.cos(hauteurSoleil);
    const lumiereY = Math.cos(azimut) * Math.cos(hauteurSoleil);
    const lumiereZ = Math.sin(hauteurSoleil);

    // Normale à la surface
    const nx = -pente.penteEst;
    const ny = -pente.penteNord;
    const nz = 1;

    const longueur = Math.sqrt(nx * nx + ny * ny + nz * nz);

    return Math.max(
        0,
        (nx * lumiereX + ny * lumiereY + nz * lumiereZ) / longueur
    );
}


function penteTerrain(longitude, latitude) {
    if (!reliefFrance) {
        return null;
    }

    const pas = 1 / reliefFrance.resolution;

    const ouest = altitudeTerrain(longitude - pas, latitude);
    const est = altitudeTerrain(longitude + pas, latitude);
    const nord = altitudeTerrain(longitude, latitude + pas);
    const sud = altitudeTerrain(longitude, latitude - pas);

    if (![ouest, est, nord, sud].every(Number.isFinite)) {
        return null;
    }

    const latitudeRad = latitude * Math.PI / 180;

    // Distance approximative en mètres entre deux cellules
    const distanceX = 111320 * Math.cos(latitudeRad) * 2 * pas;
    const distanceY = 111320 * 2 * pas;

    return {
        penteEst: (est - ouest) / distanceX,
        penteNord: (nord - sud) / distanceY
    };
}


function eclairageTerrain(longitude, latitude) {
    const pente = penteTerrain(longitude, latitude);

    if (!pente) {
        return null;
    }

    // Direction de la lumière : nord-ouest
    // Hauteur de la lumière : 45 degrés
    const azimut = 315 * Math.PI / 180;
    const hauteurSoleil = 45 * Math.PI / 180;

    // Vecteur représentant la lumière
    const lumiereX = Math.sin(azimut) * Math.cos(hauteurSoleil);
    const lumiereY = Math.cos(azimut) * Math.cos(hauteurSoleil);
    const lumiereZ = Math.sin(hauteurSoleil);

    // Normale à la surface du terrain
    const nx = -pente.penteEst;
    const ny = -pente.penteNord;
    const nz = 1;

    const longueur = Math.sqrt(nx * nx + ny * ny + nz * nz);

    // Intensité lumineuse comprise entre 0 et 1
    return Math.max(
        0,
        (nx * lumiereX + ny * lumiereY + nz * lumiereZ) / longueur
    );
}






function dessinerRelief(fondOpaque = true, decouperFrance = true) {
    if (!reliefFrance) return;
    const tailleCelluleRelief = 1;

    contexteRelief.clearRect(0, 0, largeur, hauteur);



    // Fond gris uniquement pour le mode topographique
    if (fondOpaque) {
        contexteRelief.fillStyle = "#aebbc3";
        contexteRelief.fillRect(0, 0, largeur, hauteur);
    }



    for (let y = 0; y < hauteur; y += tailleCelluleRelief) {
        for (let x = 0; x < largeur; x += tailleCelluleRelief) {

            const coordonnees = projection.invert([
                x + tailleCelluleRelief / 2,
                y + tailleCelluleRelief / 2
            ]);

            if (!coordonnees) continue;

            const [longitude, latitude] = coordonnees;
            const lumiere = eclairageTerrain(longitude, latitude);

            if (lumiere === null) continue;

            // Éclairage de référence d'un terrain horizontal
            const reference = Math.sin(Math.PI / 4);
            const difference = lumiere - reference;

            // Noir pour les ombres, blanc pour les versants éclairés

            const couleur = difference < 0 ? 0 : 255;

            const intensite = decouperFrance ? 2.5 : 1.5;
            const opacite = Math.min(
                decouperFrance ? 0.75 : 0.45,
                Math.abs(difference) * intensite
            );


            contexteRelief.fillStyle =
                `rgba(${couleur}, ${couleur}, ${couleur}, ${opacite})`;

            contexteRelief.fillRect(
                x, y, tailleCelluleRelief, tailleCelluleRelief
            );
        }
    }


    // Découper l'ombrage selon les frontières françaises
    if (decouperFrance && geometrieFrance) {
        contexteRelief.save();
        contexteRelief.globalCompositeOperation = "destination-in";

        const cheminRelief = d3.geoPath(
            projection,
            contexteRelief
        );

        contexteRelief.beginPath();
        cheminRelief(geometrieFrance);

        contexteRelief.fillStyle = "#ffffff";
        contexteRelief.fill();

        contexteRelief.restore();
    }


    imageRelief.attr(
        "href",
        canvasRelief.toDataURL("image/png")
    );
}


let geometriePaysEurope = null;

function dessinerReliefEurope() {

    if (!reliefEurope) return;

    // Utiliser temporairement le relief européen
    // pour le calcul topographique existant
    const reliefOriginal = reliefFrance;

    try {
        reliefFrance = reliefEurope;
        dessinerRelief(true, false);
    } finally {
        reliefFrance = reliefOriginal;
    }

    // Copier le résultat dans le canvas européen
    contexteEurope.clearRect(0, 0, largeur, hauteur);
    contexteEurope.drawImage(canvasRelief, 0, 0);


    // Conserver uniquement les terres émergées
    if (geometriePaysEurope) {
        contexteEurope.save();

        contexteEurope.globalCompositeOperation = "destination-in";

        const cheminPays = d3.geoPath(
            projection,
            contexteEurope
        );

        contexteEurope.beginPath();
        cheminPays(geometriePaysEurope);

        contexteEurope.fillStyle = "#ffffff";
        contexteEurope.fill();

        contexteEurope.restore();
    }


    // Envoyer l'image vers la couche SVG européenne
    imageEurope.attr(
        "href",
        canvasEurope.toDataURL("image/png")
    );
}

// Couche des observations réelles
const groupe = svg.append("g")

 // Canvas indépendant pour le relief européen

let geometrieFrance = null;

function masquerHorsFrance() {
    if (!geometrieFrance) return;

    // Garder uniquement les pixels situés
    // à l'intérieur du territoire français.
    contexteThermique.globalCompositeOperation = "destination-in";

    const chemin = d3.geoPath(

let stations = [];

let numeroRotationTemperatures = 0;

function selectionnerStationsTemperatures(rotation = numeroRotationTemperatures) {
    const tailleCase = 100;
    const cases = new Map();

    const mesures = stations.filter(s =>
        Number.isFinite(s.temperature) &&
        Number.isFinite(s.latitude) &&
        Number.isFinite(s.longitude) &&
        Number.isFinite(Number(s.altitude)) &&
        s.altitude !== null &&
        s.altitude !== "" &&
        Number(s.altitude) <= 600
    );

    mesures.forEach(station => {
        const [x, y] = projection([
            station.longitude,
            station.latitude
        ]);



        const colonne = Math.floor(x / tailleCase);
        const ligne = Math.floor(y / tailleCase);
        const cle = `${colonne}-${ligne}`;

        const centreX = (colonne + 0.5) * tailleCase;
        const centreY = (ligne + 0.5) * tailleCase;

        const distance = Math.hypot(
            x - centreX,
            y - centreY
        );

        // Préférence pour les stations de plaine,
        // sans exclure complètement les montagnes.
        const altitude = Number(station.altitude);
        const penaliteAltitude =
            Number.isFinite(altitude) && altitude > 600 ? 30 : 0;

        // Décalage déterministe selon la rotation :
        // chaque case peut choisir une autre station.
        const variation = rotation === 0
            ? 0
            : 80 * Math.sin(
                rotation * 2.4 +
                x * 0.037 +
                y * 0.053
            );

        const score = distance + penaliteAltitude + variation;

        const precedente = cases.get(cle);

        if (!precedente || score < precedente.score) {
            cases.set(cle, {
                station,
                score
            });
        }
    });

    // Sélection normale des stations pour cette rotation
    const selection = Array.from(cases.values(), c => c.station);

    // Extrêmes calculés sur TOUTES les stations éligibles,
    // indépendamment de la rotation.
    const temperatureMax = d3.max(mesures, s => s.temperature);
    const temperatureMin = d3.min(mesures, s => s.temperature);

    // En cas d'égalité, alterner entre les stations concernées.
    const stationsMax = mesures.filter(s => s.temperature === temperatureMax);
    const stationsMin = mesures.filter(s => s.temperature === temperatureMin);

    const stationMax = stationsMax[rotation % stationsMax.length];
    const stationMin = stationsMin[rotation % stationsMin.length];

    // Retirer les stations ordinaires trop proches des extrêmes
    // pour éviter la superposition des chiffres.
    const extremes = [stationMax, stationMin].filter(Boolean);

    const selectionFiltree = selection.filter(station => {
        const [x, y] = projection([station.longitude, station.latitude]);

        return extremes.every(extreme => {
            const [ex, ey] = projection([extreme.longitude, extreme.latitude]);
            return Math.hypot(x - ex, y - ey) >= 45;
        });
    });

    // Toujours afficher les deux extrêmes, à chaque rotation.
    return [...selectionFiltree, ...extremes];
    }

function dessinerTemperatures() {
    const selection = selectionnerStationsTemperatures(rotationTemperatures);

    const mesuresEligibles = stations.filter(s =>

    const stationsMax = selection.filter(

    const extremes = [
        stationsMax[rotationTemperatures % stationsMax.length],
        stationsMin[rotationTemperatures % stationsMin.length]
    ].filter((station, index, tableau) =>
        station && tableau.findIndex(s => s && s.id === station.id) === index

    coucheTemperatures.selectAll("circle.extreme")

        .attr("stroke", d =>
            d.temperature === temperatureMax ? "#ff5757" : "#55c8ff"
        )

        .attr("pointer-events", "none");

    coucheTemperatures.selectAll("text")
        .data(selection, d => d.id)
        .join("text")
        .attr("x", d => projection([d.longitude, d.latitude])[0])

        .attr("font-family", "Arial, sans-serif")

            d.temperature === temperatureMax ? "#ff5757" :

        )

        .on("mouseenter", function(event, d) {

            console.log("Survol :", d.nom);

    // Les chiffres doivent toujours être au-dessus

    coucheTemperatures.selectAll("text").raise();
}

function interpolerTemperature(x, y, mesures) {
    // Recherche des stations les plus proches
    const voisines = mesures
        .map(station => {
            const position = projection([
                station.longitude,
                station.latitude
            ]);

            const dx = position[0] - x;
            const dy = position[1] - y;

            return {
                temperature: station.temperature,
                distance2: dx * dx + dy * dy
            };
        })
        .sort((a, b) => a.distance2 - b.distance2)
        .slice(0, 8);

    if (voisines.length === 0) {
        return null;
    }

    // Si une station se trouve exactement au point calculé
    if (voisines[0].distance2 < 0.0001) {
        return voisines[0].temperature;
    }

    // Moyenne pondérée par l'inverse de la distance au carré
    let somme = 0;
    let poidsTotal = 0;

    voisines.forEach(voisine => {
        const poids = 1 / Math.max(voisine.distance2, 1);

        somme += voisine.temperature * poids;
        poidsTotal += poids;
    });

    return somme / poidsTotal;
}


function dessinerCarteThermique() {
    const mesures = stations.filter(station =>
        Number.isFinite(station.temperature) &&
        Number.isFinite(station.latitude) &&
        Number.isFinite(station.longitude)
    );

    if (mesures.length === 0) {
        return;
    }

    contexteThermique.clearRect(
        0, 0, largeur, hauteur
    );

    // Préparer les coordonnées une seule fois
    // pour accélérer les calculs.

    const positions = mesures.map(station => {
        const [x, y] = projection([
            station.longitude,
            station.latitude
        ]);

        return {
            x,
            y,
            temperature: station.temperature,
            altitude: Number.isFinite(station.altitude)
                ? station.altitude
                : null
        };
    });


    for (let y = 0; y < hauteur; y += tailleCellule) {
        for (let x = 0; x < largeur; x += tailleCellule) {

            const centreX = x + tailleCellule / 2;
            const centreY = y + tailleCellule / 2;

            const coordonnees = projection.invert([
                centreX,
                centreY
            ]);

            const altitudeCible = altitudeTerrain(
                coordonnees[0],
                coordonnees[1]
            );


            // Garder les 8 stations les plus proches
            const voisines = positions
                .map(station => {
                    const dx = station.x - centreX;
                    const dy = station.y - centreY;


                    return {
                        temperature: station.temperature,
                        altitude: station.altitude,
                        distance2: dx * dx + dy * dy
                    };

                })
                .sort((a, b) => a.distance2 - b.distance2)
                .slice(0, 8);

            if (voisines.length === 0) {
                continue;
            }

            let valeur;



            const methodeInterpolation = document.getElementById(
                "methode-interpolation"
            ).value;

            const GRADIENT = methodeInterpolation === "relief"
                ? 0.0045
                : 0;


            if (voisines[0].distance2 < 0.0001) {
                valeur = voisines[0].temperature;
            } else {
                let somme = 0;
                let totalPoids = 0;

                for (const voisine of voisines) {
                    const poids = 1 / Math.max(
                        voisine.distance2, 1
                    );

                    let temperatureCorrigee = voisine.temperature;

                    if (
                        Number.isFinite(altitudeCible) &&
                        Number.isFinite(voisine.altitude)
                    ) {
                        temperatureCorrigee -= GRADIENT * (
                            altitudeCible - voisine.altitude
                        );
                    }

                    somme += temperatureCorrigee * poids;
                    totalPoids += poids;
                }

                valeur = somme / totalPoids;
            }


            contexteThermique.fillStyle = couleurs(valeur);

            contexteThermique.fillRect(
                x,
                y,
                tailleCellule,
                tailleCellule
            );
        }
    }
    masquerHorsFrance();

    imageThermique.attr(
        "href",
        canvasThermique.toDataURL("image/png")
    );
}

function dessinerPluie() {
    couchePluie.selectAll("*").remove();

    const stationsPluvieuses = stations.filter(
        s => Number.isFinite(s.precipitation) &&
             s.precipitation > 0
    );

    const intensiteMax = d3.max(
        stationsPluvieuses,
        d => d.precipitation
    ) || 1;

    const taille = d3.scaleSqrt()
        .domain([0, intensiteMax])
        .range([8, 30]);

    couchePluie.selectAll("circle")
        .data(stationsPluvieuses, d => d.id)
        .join("circle")
        .attr("cx", d => projection([
            d.longitude, d.latitude
        ])[0])
        .attr("cy", d => projection([
            d.longitude, d.latitude
        ])[1])
        .attr("r", d => taille(d.precipitation))
        .attr("fill", "#2196f3")
        .attr("fill-opacity", 0.35)
        .attr("stroke", "#64c8ff")
        .attr("stroke-opacity", 0.5)
        .attr("stroke-width", 0.7);
}


function dessiner(parametre) {
    const disponibles = stations.filter(
        station =>
            station[parametre] !== null &&
            station[parametre] !== undefined
    );

    const valeurs = disponibles.map(station => station[parametre]);
    const domaine = d3.extent(valeurs);



    const echelle = parametre === "temperature"
        ? couleurs
        : d3.scaleSequential(d3.interpolateTurbo)
            .domain(domaine);



    groupe.selectAll("circle")
        .data(disponibles, d => d.id)
        .join("circle")
        .attr("class", "station")
        .attr("cx", d => projection([d.longitude, d.latitude])[0])
        .attr("cy", d => projection([d.longitude, d.latitude])[1])
        .attr("r", 3)
        .attr("fill", d => echelle(d[parametre]))
        .on("mouseover", function(event, d) {
            d3.select("#infos").text(
                `${d.nom} — ${parametre} : ${d[parametre]}`
            );
        });


    if (parametre === "temperature") {
        d3.select("#minimum").text("−10 °C");
        d3.select("#maximum").text("40 °C");
    } else {
        d3.select("#minimum").text(
            domaine[0] !== undefined ? domaine[0] : "—"
        );
        d3.select("#maximum").text(
            domaine[1] !== undefined ? domaine[1] : "—"
        );
    }

}

d3.select("#parametre").on("change", function() {

let thermiqueCalculee = false;

function changerAffichage() {
    survolTemperature = false;
    const mode = d3.select("#affichage").property("value");
    const parametre = d3.select("#parametre").property("value");

    // Masquer la pluie par défaut
    couchePluie.style("display", "none");

    // Tableau 2 : précipitations sur le relief
    if (mode === "thermique" && parametre === "precipitation") {
        coucheThermique.style("display", "none");
        coucheRelief.style("display", null);
        coucheTemperatures.style("display", "none");
        groupe.style("display", "none");
        contoursThermiques.style("display", null);

        dessinerRelief(true);
        dessinerPluie();

        couchePluie.style("display", null);

        d3.select("#infos").text(
            "Précipitations observées par les stations Météo-France. " +
            "Les cercles indiquent les stations ayant mesuré de la pluie."
        );

        d3.select("#minimum").text("0 mm");
        d3.select("#maximum").text("Pluie");

        return;
    }

    // Afficher les températures uniquement sur la carte thermique
    const afficherTemperatures =
        mode === "thermique" && parametre === "temperature";

    coucheTemperatures.style(
        "display",
        afficherTemperatures ? null : "none"
    );

    if (afficherTemperatures) {
        dessinerTemperatures();
    }


    if (mode === "relief") {
        coucheThermique.style("display", "none");
        coucheRelief.style("display", null);
        dessinerRelief(true);
        groupe.style("display", "none");
        contoursThermiques.style("display", null);

        d3.select("#infos").text(
            "Relief topographique Copernicus — éclairage simulé depuis le nord-ouest."
        );

        return;
    }


    if (mode === "thermique" && parametre === "temperature") {

        // Calculer la carte thermique une seule fois
        if (!thermiqueCalculee) {
            dessinerCarteThermique();
            thermiqueCalculee = true;
        }

        coucheThermique.style("display", null);
        coucheRelief.style("display", null);
        groupe.style("display", "none");
        contoursThermiques.style("display", null);
        dessinerRelief(false);

        d3.select("#infos").text(
            "Températures estimées par interpolation des stations Météo-France. Ce ne sont pas des mesures directes."
        );

    } else {

        coucheThermique.style("display", "none");
        coucheRelief.style("display", "none");
        groupe.style("display", null);
        contoursThermiques.style("display", "none");

        dessiner(parametre);
    }
}

d3.select("#affichage").on("change", changerAffichage);


d3.select("#methode-interpolation").on("change", function() {
    thermiqueCalculee = false;
    changerAffichage();
});


// ---------------------------------------------------------------
// Adaptation de la carte à la taille de son cadre
// ---------------------------------------------------------------
function redimensionnerCarte() {
    const nouvelleLargeur = Math.round(elementCarte.clientWidth);
    const nouvelleHauteur = Math.round(elementCarte.clientHeight);

    if (nouvelleLargeur < 50 || nouvelleHauteur < 50) return;
    if (nouvelleLargeur === largeur && nouvelleHauteur === hauteur) return;

    largeur = nouvelleLargeur;
    hauteur = nouvelleHauteur;

    // 1. SVG et projection
    svg.attr("viewBox", `0 0 ${largeur} ${hauteur}`);

    projection
        .scale(echelleProjection())
        .translate([largeur / 2, hauteur / 2]);

    // 2. Canvas et images SVG associées
    [canvasThermique, canvasRelief, canvasEurope].forEach(canvas => {
        canvas.width = largeur;
        canvas.height = hauteur;
    });

    [imageEurope, imageRelief, imageThermique].forEach(image => {
        image.attr("width", largeur).attr("height", hauteur);
    });

    // 3. Tracés vectoriels (pays, départements, contours)
    svg.selectAll("path").attr("d", cheminGeo);

    // 4. Rasters : relief européen, puis le mode d'affichage actif
    thermiqueCalculee = false;
    dessinerReliefEurope();
    changerAffichage();
}

let minuterieRedimensionnement = null;

new ResizeObserver(() => {
    clearTimeout(minuterieRedimensionnement);
    minuterieRedimensionnement = setTimeout(redimensionnerCarte, 300);
}).observe(elementCarte);
