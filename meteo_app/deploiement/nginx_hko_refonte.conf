# HKO Météo — compléments Nginx de la refonte (à inclure dans le bloc
# « server » existant de hashkao.com, AVANT le « location / » qui transmet
# à Gunicorn). À ADAPTER : le chemin de HKO_DONNEES (ici /opt/hashkao/meteo_app/data/hko, valeur par défaut du code)
# et celui de STATIC_ROOT (ici /opt/hashkao/staticfiles), l'adresse de Gunicorn (ici 127.0.0.1:8000).
#
#   include /etc/nginx/snippets/hko_refonte.conf;
#
# Vérifier puis recharger :  sudo nginx -t && sudo systemctl reload nginx

# Compression des réponses JSON et des scripts (si absent du bloc http)
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types application/json application/javascript text/css image/svg+xml application/geo+json;

# Fichiers statiques versionnés (?v=empreinte) : cache long et immuable.
# Si un « location /static/ » existe déjà, n'y ajouter que les deux lignes
# expires / add_header.
location /static/ {
    alias /opt/hashkao/staticfiles/;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip_static on;
}

# Fichiers en cours d'écriture : jamais servis (placé avant les règles suivantes)
location ~ ^/meteo/donnees/derives/.*/\.tmp_ { return 404; }

# Ressources dérivées : servies directement par Nginx (sans Python).
# Les noms portent une heure d'observation ou une empreinte : contenu figé.
# Les fichiers en cours d'écriture portent un nom temporaire (.tmp_*) : jamais servis.
location ~ ^/meteo/donnees/derives/(geocolour|video)/(haute|standard|leger)/[^/]+(/[^/]+)?$ {
    root /opt/hashkao/meteo_app/data/hko/publication;
    rewrite ^/meteo/donnees/derives/(.*)$ /derives/$1 break;
    add_header Cache-Control "public, max-age=604800, immutable";
    # Absent (image adaptée pas encore produite) : Django la fabrique
    error_page 404 = @hko_django;
    types { image/webp webp; video/mp4 mp4; }
    # Lecture vidéo : Nginx répond nativement aux requêtes partielles
    # (Range), indispensables à Safari ; aucun module supplémentaire.
}

location ~ ^/meteo/donnees/derives/opera/(standard|leger)/\d{8}/opera_\d{8}T\d{4}Z\.bin$ {
    root /opt/hashkao/meteo_app/data/hko/publication;
    rewrite ^/meteo/donnees/derives/(.*)$ /derives/$1 break;
    default_type application/octet-stream;
    # Fichier déjà compressé : le navigateur le décompresse lui-même
    add_header Content-Encoding gzip;
    add_header Cache-Control "public, max-age=604800, immutable";
    gzip off;
}

location @hko_django {
    # Même transmission que le « location / » existant (à recopier à l'identique)
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
