<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Générateur de mots de passe</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Générateur de mots de passe</h1>
      <form method="POST" action="{{ url_for('generate_password') }}">
        <label for="length">Longueur du mot de passe :</label>
        <input
          type="number"
          name="length"
          id="length"
          min="6"
          max="30"
          required
        /><br /><br />

        <label>Inclure des majuscules :</label>
        <label class="switch">
          <input type="checkbox" name="maj" />
          <span class="slider"></span> </label
        ><br /><br />

        <label>Inclure des chiffres :</label>
        <label class="switch">
          <input type="checkbox" name="chiffres" />
          <span class="slider"></span> </label
        ><br /><br />

        <label>Inclure des caractères spéciaux :</label>
        <label class="switch">
          <input type="checkbox" name="speciaux" />
          <span class="slider"></span> </label
        ><br /><br />

        <button type="submit">Générer le mot de passe</button>
      </form>
    </div>
  </body>
</html>
